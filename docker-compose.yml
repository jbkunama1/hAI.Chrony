services:
  chrony:
    image: ghcr.io/jbkunama1/haichrony:latest
    container_name: highfish1_chrony
    restart: unless-stopped
    cap_add:
      - SYS_TIME
    ports:
      - "123:123/udp"
      - "323:323/tcp"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - chrony_run:/run/chrony
      - chrony_lib:/var/lib/chrony
      # Optional: eigene Config statt der eingebauten
      # - /chrony/chrony.conf:/etc/chrony.conf:ro
    networks:
      - highfishnetwork

volumes:
  chrony_run:
  chrony_lib:

networks:
  highfishnetwork:
    external: true
