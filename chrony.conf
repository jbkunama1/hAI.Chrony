# hAI.Chrony - Default-Konfiguration (per Bind-Mount nach /etc/chrony.conf ueberschreibbar)
server ptbtime1.ptb.de iburst prefer
server ptbtime2.ptb.de iburst
server ptbtime3.ptb.de iburst
server time1.google.com iburst
server ntp1.t-online.de iburst
server ntp.scc.kit.edu iburst prefer
server europe.pool.ntp.org iburst
server time.cloudflare.com iburst prefer

keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
#log tracking measurements statistics
logdir /var/log/chrony
maxupdateskew 100.0
rtcsync
makestep 1 3

# NTP-Server fuer das lokale Netz
#allow 192.168.178.0/24
#allow 127.0.0.1
allow

broadcast 60 192.168.178.255

clientloglimit 524288
dumpdir /var/run/chrony
ratelimit interval 1 burst 16

# chronyc-Zugriff
cmdport 323
bindcmdaddress 0.0.0.0
cmdallow 0.0.0.0/0
cmdallow 127.0.0.1
cmdallow 10.11.0.0/16
